[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "diving-cv"
version = "0.1.0"
description = "Calibrated top-down pose tracking and kinematic analysis for 1 m springboard diving"
readme = "README.md"
requires-python = ">=3.10,<3.15"
dependencies = [
  "numpy>=1.26,<3",
  "opencv-python>=4.9,<5",
  "pandas>=2.1,<3",
  "filterpy>=1.4.5,<2",
  "ultralytics>=8.3,<9",
]

[project.scripts]
diving-track = "diving_tracker.cli:main"

[tool.setuptools.packages.find]
include = ["diving_tracker*"]
